name: Desktop app

# Builds the offline Electron app for Windows, Linux and macOS.
# - Run it manually (Actions > Desktop app > Run workflow): the installers are attached to the run as artifacts.
# - Push a tag like "desktop-v1.0.0": the installers are also published as a GitHub release.

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
          - os: macos-latest
            script: dist:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Build desktop app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no code signing certificate
        run: |
          npm ci
          npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: eendraadschema-${{ runner.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.dmg

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Eendraadschema desktop ${{ github.ref_name }}
          files: installers/*
          body: |
            Offline desktop version of Eendraadschema.
            - Windows: `Eendraadschema Setup x.y.z.exe` (installer) or `Eendraadschema-x.y.z-portable.exe` (no installation needed)
            - Linux: `Eendraadschema-x.y.z.AppImage`
            - macOS: `Eendraadschema-x.y.z-arm64.dmg` (Apple silicon) or `Eendraadschema-x.y.z.dmg` (Intel)
