server {
    listen 80;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /eendraadschema { return 301 /eendraadschema/; }
    location /eendraadschema/ {
        alias /usr/share/nginx/eendraadschema/;
    }
}
